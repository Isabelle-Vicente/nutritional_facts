version: '3.8'

services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: postgres_nutricao
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql

  adminer:
    image: adminer:latest
    container_name: adminer_nutricao
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: